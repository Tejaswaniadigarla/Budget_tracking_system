{% extends "base.html" %}

{% block title %}Transactions - Budget Tracking System{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Transactions</h1>
        <button class="btn btn-primary" onclick="openTransactionModal()">
            <i class="fas fa-plus"></i> Add Transaction
        </button>
    </div>

    <!-- Transaction Form Modal -->
    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Transaction</h2>
                <span class="close" onclick="closeTransactionModal()">&times;</span>
            </div>
            <form id="transactionForm" class="modal-body">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="transactionDate">Date</label>
                    <input type="date" id="transactionDate" name="transactionDate" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" placeholder="Enter transaction details"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                    <button type="button" class="btn btn-secondary" onclick="closeTransactionModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="card">
        <div class="card-body">
            <div class="filter-row">
                <div class="form-group">
                    <input type="text" id="searchInput" placeholder="Search description..." class="form-control">
                </div>
                <div class="form-group">
                    <select id="categoryFilter" class="form-control">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <button type="button" class="btn btn-secondary" onclick="loadTransactions()">Filter</button>
            </div>
        </div>
    </div>

    <!-- Transactions Table -->
    <div class="card">
        <div class="card-header">
            <h2>All Transactions</h2>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsList">
                        <tr><td colspan="6" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Styles -->
<style>
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
}

.modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background-color: #fefefe;
    padding: 0;
    border: 1px solid #888;
    border-radius: 8px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.modal-header {
    padding: 20px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {
    color: #aaa;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    color: black;
}

.modal-body {
    padding: 20px;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.form-actions button {
    flex: 1;
}
</style>

<script>
// Set current date as default
document.getElementById('transactionDate').valueAsDate = new Date();

// Load categories on page load
async function loadCategories() {
    try {
        const response = await fetch('{{ url_for("get_categories") }}');
        const categories = await response.json();

        const categorySelect = document.getElementById('category');
        const categoryFilter = document.getElementById('categoryFilter');

        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.category_id;
            option.textContent = `${cat.name} (${cat.type})`;
            categorySelect.appendChild(option);

            const filterOption = document.createElement('option');
            filterOption.value = cat.category_id;
            filterOption.textContent = cat.name;
            categoryFilter.appendChild(filterOption);
        });
    } catch (error) {
        console.error('Error loading categories:', error);
    }
}

// Load transactions
async function loadTransactions() {
    try {
        const response = await fetch('{{ url_for("transactions") }}');
        const data = await response.json();

        const categoryFilter = document.getElementById('categoryFilter').value;
        const searchInput = document.getElementById('searchInput').value.toLowerCase();

        let filtered = data;
        if (categoryFilter) {
            filtered = filtered.filter(t => t.category_id == categoryFilter);
        }
        if (searchInput) {
            filtered = filtered.filter(t => t.description.toLowerCase().includes(searchInput));
        }

        const html = filtered.map(t => `
            <tr>
                <td>${new Date(t.transaction_date).toLocaleDateString()}</td>
                <td>${t.category_name}</td>
                <td><span class="badge ${t.type === 'Income' ? 'badge-success' : 'badge-danger'}">${t.type}</span></td>
                <td class="${t.type === 'Income' ? 'income' : 'expense'}">
                    ${t.type === 'Income' ? '+' : '-'}$${parseFloat(t.amount).toFixed(2)}
                </td>
                <td>${t.description || '-'}</td>
                <td>
                    <button class="btn-icon" onclick="deleteTransaction(${t.transaction_id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');

        document.getElementById('transactionsList').innerHTML = html || '<tr><td colspan="6" class="text-center">No transactions found</td></tr>';
    } catch (error) {
        console.error('Error loading transactions:', error);
    }
}

// Add transaction
document.getElementById('transactionForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = {
        category_id: document.getElementById('category').value,
        amount: document.getElementById('amount').value,
        transaction_date: document.getElementById('transactionDate').value,
        description: document.getElementById('description').value
    };

    try {
        const response = await fetch('{{ url_for("transactions") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const result = await response.json();
        if (result.success) {
            closeTransactionModal();
            document.getElementById('transactionForm').reset();
            loadTransactions();
        } else {
            alert('Error: ' + result.message);
        }
    } catch (error) {
        alert('Error adding transaction: ' + error.message);
    }
});

// Delete transaction
async function deleteTransaction(id) {
    if (confirm('Are you sure you want to delete this transaction?')) {
        try {
            const response = await fetch(`{{ url_for("delete_transaction", transaction_id=999) }}`.replace('999', id), {
                method: 'DELETE'
            });
            const result = await response.json();
            if (result.success) {
                loadTransactions();
            }
        } catch (error) {
            alert('Error deleting transaction');
        }
    }
}

// Modal functions
function openTransactionModal() {
    document.getElementById('transactionModal').classList.add('show');
}

function closeTransactionModal() {
    document.getElementById('transactionModal').classList.remove('show');
}

// Load data on page load
loadCategories();
loadTransactions();
</script>
{% endblock %}
