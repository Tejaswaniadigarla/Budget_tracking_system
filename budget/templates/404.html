{% extends "base.html" %}

{% block title %}Page Not Found - Budget Tracking System{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>The page you are looking for doesn't exist.</p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
        </div>
    </div>
</div>

<style>
.error-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
}

.error-content {
    text-align: center;
}

.error-content h1 {
    font-size: 120px;
    margin: 0;
    color: #e74c3c;
}

.error-content h2 {
    font-size: 36px;
    margin: 10px 0;
}

.error-content p {
    font-size: 18px;
    color: #7f8c8d;
    margin: 20px 0;
}
</style>
{% endblock %}
